version: "3.9"

services:
  nextjs:
    build: .
    restart: always
    volumes:
      - ./public/images:/app/public/images
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextjs-kl.rule=Host(`katharina-luisa.com`)"
      - "traefik.http.routers.nextjs-kl.entrypoints=websecure"
      - "traefik.http.routers.nextjs-kl.tls=true"
      - "traefik.http.routers.nextjs-kl.tls.certresolver=letsencrypt"
      - "traefik.http.services.nextjs-kl.loadbalancer.server.port=3010"
networks:
  traefik_proxy:
    external: true